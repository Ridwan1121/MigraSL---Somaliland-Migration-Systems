  const qId = new URLSearchParams(window.location.search).get("id");

<script>
const API_URL = window.MIGRASL_API_URL;
const token = localStorage.getItem('access_token');
if (!token) window.location.href = 'login.html';

let immigrantsById = {};

function escapeHtml(v) {
    return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function readError(response) {
    try {
        const err = await response.json();
        if (typeof err.detail === 'string') return err.detail;
    } catch (e) {}
    return `HTTP ${response.status}`;
}

async function loadImmigrants() {
    try {
        const response = await fetch(`${API_URL}/immigrants/`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!response.ok) throw new Error(await readError(response));
        const data = await response.json();
        const list = data.immigrants || [];
        immigrantsById = Object.fromEntries(list.map(i => [i.id, i]));
        const table = document.getElementById('immigrantsTable');

        if (list.length === 0) {
            table.innerHTML = '<tr><td colspan="8" class="text-center py-8 text-gray-400">Ma jiro ajaanib</td></tr>';
            return;
        }
        table.innerHTML = list.map(i => `
            <tr class="table-row">
                <td class="py-3 text-gray-400">${Number(i.id)}</td>
                <td class="py-3 text-white">${escapeHtml(i.name)}</td>
                <td class="py-3 text-gray-300">${escapeHtml(i.country)}</td>
                <td class="py-3 text-gray-300">${escapeHtml(i.region)}</td>
                <td class="py-3 text-gray-300">${escapeHtml(i.entry_point)}</td>
                <td class="py-3 text-gray-300">${escapeHtml(i.district)}</td>
                <td class="py-3"><span class="badge badge-success">${escapeHtml(i.status)}</span></td>
                <td class="py-3">
                    <button onclick="openEditModal(${Number(i.id)})" class="text-blue-400 hover:text-blue-300 mr-3"><i class="fas fa-edit"></i></button>
                    <button onclick="deleteImmigrant(${Number(i.id)})" class="text-red-400 hover:text-red-300"><i class="fas fa-trash"></i></button>
                </td>
            </tr>`).join('');
    } catch (error) {
        showError('Qalad: ' + error.message);
    }
}

function toggleEditVisitDetails() {
    const other = document.getElementById('editVisitReason').value === 'other';
    document.getElementById('editVisitDetailsBox').classList.toggle('hidden', !other);
    if (!other) document.getElementById('editVisitDetails').value = '';
}

function openEditModal(id) {
    const i = immigrantsById[id];
    if (!i) return;
    document.getElementById('editId').value = i.id;
    document.getElementById('editName').value = i.name || '';
    document.getElementById('editCountry').value = i.country || '';
    document.getElementById('editRegion').value = i.region || '';
    document.getElementById('editEntryPoint').value = i.entry_point || '';
    document.getElementById('editDistrict').value = i.district || '';
    document.getElementById('editPassport').value = i.passport || '';
    document.getElementById('editVisitReason').value = i.visit_reason || '';
    document.getElementById('editVisitDetails').value = i.visit_reason_details || '';
    toggleEditVisitDetails();
    document.getElementById('editModal').classList.remove('hidden');
}

function closeEditModal() {
    document.getElementById('editModal').classList.add('hidden');
}

async function handleEditSubmit(event) {
    event.preventDefault();
    const id = document.getElementById('editId').value;
    const reason = document.getElementById('editVisitReason').value || null;
    const details = (document.getElementById('editVisitDetails').value || '').trim();
    if (reason === 'other' && !details) {
        showError('Fadlan qor sababta kale ee booqashada');
        return;
    }
    const data = {
        name: document.getElementById('editName').value,
        country: document.getElementById('editCountry').value,
        region: document.getElementById('editRegion').value,
        entry_point: document.getElementById('editEntryPoint').value,
        district: document.getElementById('editDistrict').value,
        passport: document.getElementById('editPassport').value || null,
        visit_reason: reason,
        visit_reason_details: reason === 'other' ? details : null,
        status: (immigrantsById[id] || {}).status || 'registered'
    };
    try {
        const response = await fetch(`${API_URL}/immigrants/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify(data)
        });
        if (!response.ok) throw new Error(await readError(response));
        if (document.getElementById('migraslPhotoInput').files.length) {
            await migraslUploadImmigrantPhoto(id, API_URL, token);
        }
        showSuccess('✅ Ajaanib waa la cusbooneysiiyay!');
        closeEditModal();
        loadImmigrants();
    } catch (error) {
        showError('❌ Qalad: ' + error.message);
    }
}

async function deleteImmigrant(id) {
    const name = (immigrantsById[id] || {}).name || id;
    if (!confirm(`Ma hubtaa inaad tirtirto "${name}"?`)) return;
    try {
        const response = await fetch(`${API_URL}/immigrants/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!response.ok) throw new Error(await readError(response));
        showSuccess('✅ Ajaanib waa la tirtiray!');
        loadImmigrants();
    } catch (error) {
        showError('❌ Qalad: ' + error.message);
    }
}

function showError(msg) {
    const div = document.getElementById('errorMessage');
    div.textContent = msg;
    div.classList.remove('hidden');
    setTimeout(() => div.classList.add('hidden'), 5000);
}

function showSuccess(msg) {
    const div = document.getElementById('successMessage');
    div.textContent = msg;
    div.classList.remove('hidden');
    setTimeout(() => div.classList.add('hidden'), 5000);
}

loadImmigrants();
</script>

<script>
function migraslPreviewPhoto(input) {
  const img = document.getElementById("migraslPhotoPreview");
  if (!img) return;
  const file = input && input.files && input.files[0];
  if (!file) { img.classList.add("hidden"); img.removeAttribute("src"); return; }
  img.src = URL.createObjectURL(file);
  img.classList.remove("hidden");
}
async function migraslUploadImmigrantPhoto(immigrantId, apiUrl, token) {
  const input = document.getElementById("migraslPhotoInput");
  const statusEl = document.getElementById("migraslPhotoStatus");
  const file = input && input.files && input.files[0];
  if (!file || !immigrantId) return null;
  const fd = new FormData();
  fd.append("file", file);
  const res = await fetch(`${apiUrl}/photos/${immigrantId}`, {
    method: "POST",
    headers: token ? { "Authorization": `Bearer ${token}` } : {},
    body: fd
  });
  const data = await res.json().catch(() => ({}));
  if (statusEl) {
    statusEl.textContent = res.ok ? "Sawirka waa la upload gareeyay!" : (data.detail || `HTTP ${res.status}`);
  }
  return res.ok ? data : null;
}
</script>
