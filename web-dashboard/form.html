<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diiwaangelinta Ajaanibta</title>
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        body { background: #0a0e1a; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; color: #fff; }
        .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; }
        .input-field { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 14px 16px; border-radius: 12px; width: 100%; }
        .input-field:focus { outline: none; border-color: #3b82f6; background: rgba(59,130,246,0.1); }
        .btn-primary { background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); color: white; padding: 14px; border-radius: 12px; font-weight: 600; width: 100%; border: none; cursor: pointer; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(59,130,246,0.3); }
        .error-message { background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.3); color: #ef4444; padding: 12px; border-radius: 8px; }
        .success-message { background: rgba(34,197,94,0.2); border: 1px solid rgba(34,197,94,0.3); color: #22c55e; padding: 12px; border-radius: 8px; }
    </style>
</head>
<body>
<div class="flex">
    <aside class="w-64 flex-shrink-0 hidden lg:block" style="background: rgba(10,14,26,0.95); border-right: 1px solid rgba(255,255,255,0.06); min-height: 100vh; position: sticky; top: 0;">
        <div class="p-6 border-b border-white/5">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-500/20 flex items-center justify-center">
                    <i class="fas fa-id-card text-blue-400 text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white">MigraSL</h1>
                    <p class="text-xs text-gray-400">Somaliland Migration</p>
                </div>
            </div>
        </div>
        <nav class="p-4 space-y-1">
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-blue-500/10 hover:text-white transition"><i class="fas fa-chart-pie"></i> Dashboard</a>
            <a href="form.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-500/15 text-blue-400 border border-blue-500/20"><i class="fas fa-user-plus"></i> Diiwaangeli</a>
            <a href="edit.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-blue-500/10 hover:text-white transition"><i class="fas fa-edit"></i> Edit/Delete</a>
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-blue-500/10 hover:text-white transition"><i class="fas fa-camera"></i> Weji-Aqoonsi</a>
        </nav>
    </aside>

    <main class="flex-1 p-4 lg:p-8">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h2 class="text-2xl font-bold text-white">Diiwaangelinta Ajaanibta</h2>
                <p class="text-gray-400 text-sm">Ku dar ajaanib cusub nidaamka</p>
            </div>
            <a href="index.html" class="flex items-center gap-2 bg-white/5 rounded-full px-4 py-2 border border-white/5 text-gray-300 hover:bg-white/10 transition">
                <i class="fas fa-arrow-left"></i> Ku noqo
            </a>
        </div>

        <div class="glass p-6 lg:p-8 max-w-4xl">
            <div id="errorMessage" class="error-message hidden mb-4"></div>
            <div id="successMessage" class="success-message hidden mb-4"></div>

            <form id="immigrantForm" onsubmit="handleSubmit(event)">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="name" class="block text-gray-400 text-sm mb-2">Magaca Buuxa *</label>
                        <input type="text" id="name" class="input-field" placeholder="Ahmed Ali" required />
                    </div>
                    <div>
                        <label for="country" class="block text-gray-400 text-sm mb-2">Dalka *</label>
                        <input type="text" id="country" class="input-field" placeholder="Somalia" required />
                    </div>
                    <div>
                        <label for="region" class="block text-gray-400 text-sm mb-2">Gobolka *</label>
                        <input type="text" id="region" class="input-field" placeholder="Banadir" required />
                    </div>
                    <div>
                        <label for="entry_point" class="block text-gray-400 text-sm mb-2">Xudduudda Laga Soo Galay *</label>
                        <input type="text" id="entry_point" class="input-field" placeholder="Aden Adde" required />
                    </div>
                    <div>
                        <label for="district" class="block text-gray-400 text-sm mb-2">Degmada *</label>
                        <input type="text" id="district" class="input-field" placeholder="Hodan" required />
                    </div>
                    <div>
                        <label for="passport" class="block text-gray-400 text-sm mb-2">Baasaboorka</label>
                        <input type="text" id="passport" class="input-field" placeholder="A1234567" />
                    </div>
                </div>
                <div class="mt-6 flex gap-3">
                    <button type="submit" class="btn-primary flex-1">
                        <i class="fas fa-save mr-2"></i> Diiwaangeli
                    </button>
                    <button type="button" onclick="resetForm()" class="flex-1 bg-white/5 text-gray-300 py-3 rounded-xl font-semibold border border-white/10 hover:bg-white/10 transition">
                        <i class="fas fa-redo mr-2"></i> Nadiifi
                    </button>
                </div>
            
<div id="migraslPhotoUploadBox" class="mt-4 p-4 rounded-xl bg-gray-900/70 border border-gray-700 space-y-3">
  <div class="flex items-center justify-between">
    <label for="migraslPhotoInput" class="text-sm font-semibold text-gray-200">Sawirka Ajaanibka (/photos/{id})</label>
    <span id="migraslPhotoStatus" class="text-xs text-emerald-400"></span>
  </div>
  <input type="file" id="migraslPhotoInput" accept="image/*" onchange="migraslPreviewPhoto(this)" class="block w-full text-xs text-gray-300 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-blue-600 file:text-white hover:file:bg-blue-500" />
  <img id="migraslPhotoPreview" alt="Photo Preview" class="hidden w-32 h-32 object-cover rounded-lg border border-gray-600" />
</div>

</form>
        </div>
    </main>
</div>

<script src="api-config.js">
async function migraslAttachPhotoAfterSave(responseData, fallbackId) {
  const qId = new URLSearchParams(window.location.search).get("id");
  const targetId = (responseData && (responseData.id || (responseData.immigrant && responseData.immigrant.id))) || fallbackId || qId;
  const apiUrl = (typeof API_URL !== "undefined" && API_URL) || window.MIGRASL_API_URL || localStorage.getItem("migrasl_api_url") || "http://127.0.0.1:8000";
  const token = (typeof token !== "undefined" && token) || localStorage.getItem("access_token") || "";
  if (targetId && typeof migraslUploadImmigrantPhoto === "function") {
    await migraslUploadImmigrantPhoto(targetId, apiUrl, token);
  }
}

</script>
<script>
    const API_URL = window.MIGRASL_API_URL;
    const token = localStorage.getItem('access_token');

    if (!token) window.location.href = 'login.html';

    async function handleSubmit(event) {
        event.preventDefault();
        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');
        errorDiv.classList.add('hidden');
        successDiv.classList.add('hidden');

        const data = {
            name: document.getElementById('name').value,
            country: document.getElementById('country').value,
            region: document.getElementById('region').value,
            entry_point: document.getElementById('entry_point').value,
            district: document.getElementById('district').value,
            passport: document.getElementById('passport').value || null,
            status: 'registered'
        };

        try {
            const response = await fetch(`${API_URL}/immigrants/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(data)
            });

            if (!response.ok) throw new Error('Qalad dhacay');

            successDiv.textContent = '✅ Ajaanib cusub waa la diiwaangeliyay!';
            successDiv.classList.remove('hidden');
            resetForm();

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
        } catch (error) {
            errorDiv.textContent = '❌ Qalad: ' + error.message;
            errorDiv.classList.remove('hidden');
        }
    }

    function resetForm() {
        document.getElementById('immigrantForm').reset();
    }
</script>

<script>
function migraslPreviewPhoto(input) {
  const img = document.getElementById("migraslPhotoPreview");
  if (!img) return;
  const file = input && input.files && input.files[0];
  if (!file) { img.classList.add("hidden"); img.removeAttribute("src"); return; }
  img.src = URL.createObjectURL(file);
  img.classList.remove("hidden");
}
async function migraslUploadImmigrantPhoto(immigrantId, apiUrl, token) {
  const input = document.getElementById("migraslPhotoInput");
  const statusEl = document.getElementById("migraslPhotoStatus");
  const file = input && input.files && input.files[0];
  if (!file || !immigrantId) return null;
  const fd = new FormData();
  fd.append("file", file);
  const res = await fetch(`${apiUrl}/photos/${immigrantId}`, {
    method: "POST",
    headers: token ? { "Authorization": `Bearer ${token}` } : {},
    body: fd
  });
  const data = await res.json().catch(() => ({}));
  if (statusEl) {
    statusEl.textContent = res.ok ? "Sawirka waa la upload gareeyay!" : (data.detail || `HTTP ${res.status}`);
  }
  return res.ok ? data : null;
}
</script>


<script>
async function migraslSubmitWithPhoto(savedData, fallbackId) {
  const qId = new URLSearchParams(window.location.search).get("id");
  const targetId = (savedData && (savedData.id || (savedData.immigrant && savedData.immigrant.id))) || fallbackId || qId;
  const apiUrl = (typeof API_URL !== "undefined" && API_URL) || window.API_URL || localStorage.getItem("migrasl_api_url") || "http://127.0.0.1:8000";
  const token = (typeof authToken !== "undefined" && authToken) || window.authToken || localStorage.getItem("migrasl_token") || localStorage.getItem("access_token") || "";
  if (!targetId || typeof migraslUploadImmigrantPhoto !== "function") return null;
  return await migraslUploadImmigrantPhoto(targetId, apiUrl, token);
}
</script>

  <script src="i18n.js"></script>
</body>
